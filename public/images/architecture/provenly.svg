<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 190" role="img" aria-label="provenly architecture: a tool call passes five PreToolUse guards, record-activity appends it to a per-turn ledger, and at Stop the claim checker and verify gate compare the turn's claims against that ledger and block the turn when the evidence does not support them.">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#71717a" />
    </marker>
  </defs>
  <style>
    .box { fill: none; stroke: #71717a; stroke-width: 1.5; }
    .t { fill: #71717a; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .s { fill: #71717a; font-family: ui-monospace, monospace; font-size: 10px; opacity: 0.7; text-anchor: middle; }
    .l { stroke: #71717a; stroke-width: 1.5; }
    .cap { fill: #71717a; font-family: ui-monospace, monospace; font-size: 10px; opacity: 0.6; }
  </style>
  <text class="cap" x="10" y="20">Simplified architecture</text>
  <rect class="box" x="10" y="50" width="140" height="72" rx="10" />
  <text class="t" x="80" y="82">Tool call</text>
  <text class="s" x="80" y="100">5 PreToolUse guards</text>
  <line class="l" x1="150" y1="86" x2="196" y2="86" marker-end="url(#arrow)" />
  <rect class="box" x="200" y="50" width="140" height="72" rx="10" />
  <text class="t" x="270" y="82">record-activity</text>
  <text class="s" x="270" y="100">append-only ledger</text>
  <line class="l" x1="340" y1="86" x2="386" y2="86" marker-end="url(#arrow)" />
  <rect class="box" x="390" y="50" width="140" height="72" rx="10" />
  <text class="t" x="460" y="82">Stop</text>
  <text class="s" x="460" y="100">claim-check · verify-gate</text>
  <line class="l" x1="530" y1="86" x2="576" y2="86" marker-end="url(#arrow)" />
  <rect class="box" x="580" y="50" width="140" height="72" rx="10" />
  <text class="t" x="650" y="82">Block or pass</text>
  <text class="s" x="650" y="100">evidence, not trust</text>
  <text class="cap" x="10" y="160">A claim of a green gate that the ledger cannot support stops the turn.</text>
</svg>
